<!-- brands-bar · brands · an aligned band of partner logos, neutral, on a discreet contrasting background -->
<section class="brands" data-section="brands-bar">
  <style>
    .brands{background:var(--bg); color:var(--fg);
      padding:clamp(28px,4vw,52px) clamp(20px,5vw,80px);
      border-top:1px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-bottom:1px solid color-mix(in srgb, var(--muted) 35%, transparent)}
    .brands__row{display:flex; align-items:center; gap:clamp(20px,4vw,56px); flex-wrap:wrap;
      justify-content:space-between}
    .brands__label{font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em;
      font-size:12px; color:var(--muted); white-space:nowrap; flex:0 0 auto; max-width:18ch}
    .brands__logos{display:flex; align-items:center; gap:clamp(20px,4vw,56px); flex-wrap:wrap;
      flex:1 1 auto; justify-content:flex-end}
    .brands__logo{height:clamp(24px,3vw,38px); width:auto; display:block;
      filter:grayscale(1); opacity:.6; transition:opacity .3s, filter .3s}
    .brands__logo:hover{opacity:1; filter:grayscale(0)}
    .brands .reveal{opacity:1}
    @media (max-width:880px){
      .brands__row{justify-content:center; text-align:center}
      .brands__logos{justify-content:center; gap:clamp(18px,6vw,36px)}
    }
  </style>

  <div class="brands__row reveal">
    <p class="brands__label">{{BRANDS_LABEL}}</p>
    <div class="brands__logos">
      <!-- repeat: logo -->
      <img class="brands__logo" src="{{LOGO_IMG}}" alt="{{LOGO_ALT}}">
      <!-- /repeat -->
    </div>
  </div>
</section>
