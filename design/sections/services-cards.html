<!-- services-cards · services · a grid of service cards (Lucide icon + title + short text) -->
<section class="svc-cards" data-section="services-cards">
  <style>
    .svc-cards{background:var(--bg); color:var(--fg);
      padding:clamp(48px,8vw,112px) clamp(20px,5vw,80px)}
    .svc-cards__head{max-width:58ch; margin:0 0 clamp(28px,4vw,48px)}
    .svc-cards__kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
      font-size:12px; color:var(--accent); margin:0 0 14px}
    .svc-cards__title{font-family:var(--serif); font-weight:500; line-height:1.08; letter-spacing:-.01em;
      font-size:clamp(30px,4vw,52px); margin:0}
    .svc-cards__grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2vw,24px)}
    .svc-cards__card{border:1px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-radius:10px; padding:clamp(22px,2.6vw,34px); transition:border-color .3s, transform .3s}
    .svc-cards__card:hover{border-color:var(--accent); transform:translateY(-3px)}
    .svc-cards__icon{width:clamp(40px,4.4vw,52px); height:clamp(40px,4.4vw,52px); border-radius:9px;
      display:grid; place-items:center; margin:0 0 clamp(16px,2vw,22px);
      background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent)}
    .svc-cards__icon svg{width:48%; height:48%}
    .svc-cards__name{font-family:var(--sans); font-weight:600; font-size:clamp(17px,1.4vw,20px);
      margin:0 0 10px}
    .svc-cards__text{font-family:var(--sans); font-size:15px; line-height:1.6; color:var(--muted); margin:0}
    .svc-cards .reveal{opacity:1}
    @media (max-width:880px){ .svc-cards__grid{grid-template-columns:1fr 1fr} }
    @media (max-width:480px){ .svc-cards__grid{grid-template-columns:1fr} }
  </style>

  <div class="svc-cards__head reveal">
    <p class="svc-cards__kicker">{{KICKER}}</p>
    <h2 class="svc-cards__title">{{HEADLINE}}</h2>
  </div>

  <div class="svc-cards__grid">
    <!-- repeat: service -->
    <article class="svc-cards__card reveal">
      <div class="svc-cards__icon" aria-hidden="true">
        <!-- Lucide icon (a single family); replace the path with the Lucide icon that suits the service -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/>
          <path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/>
        </svg>
      </div>
      <h3 class="svc-cards__name">{{SERVICE_TITLE}}</h3>
      <p class="svc-cards__text">{{SERVICE_TEXT}}</p>
    </article>
    <!-- /repeat -->
  </div>
</section>
