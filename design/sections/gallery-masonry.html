<!-- gallery-masonry · gallery · variable-height mosaic (masonry) edge-to-edge -->
<section class="gal-mas" data-section="gallery-masonry">
  <style>
    .gal-mas{background:var(--bg); color:var(--fg);
      padding:clamp(48px,8vw,104px) clamp(12px,2vw,28px)}
    .gal-mas__head{padding:0 clamp(8px,2vw,24px); margin:0 0 clamp(24px,4vw,44px); max-width:64ch}
    .gal-mas__kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
      font-size:12px; color:var(--accent); margin:0 0 14px}
    .gal-mas__title{font-family:var(--serif); font-weight:500; line-height:1.06; letter-spacing:-.015em;
      font-size:clamp(34px,5vw,68px); margin:0}
    .gal-mas__cols{column-count:3; column-gap:clamp(10px,1.4vw,18px)}
    .gal-mas__item{break-inside:avoid; margin:0 0 clamp(10px,1.4vw,18px); position:relative;
      overflow:hidden; border-radius:3px}
    .gal-mas__item img{width:100%; height:auto; display:block; transition:transform .6s ease}
    .gal-mas__item:hover img{transform:scale(1.05)}
    .gal-mas__cap{position:absolute; left:0; right:0; bottom:0; padding:14px;
      font-family:var(--sans); font-size:13px; color:#fff;
      background:linear-gradient(transparent, rgba(0,0,0,.55)); opacity:0; transition:opacity .3s}
    .gal-mas__item:hover .gal-mas__cap{opacity:1}
    .gal-mas .reveal{opacity:1}
    @media (max-width:880px){ .gal-mas__cols{column-count:2} }
    @media (max-width:480px){ .gal-mas__cols{column-count:1} }
  </style>

  <div class="gal-mas__head reveal">
    <p class="gal-mas__kicker">{{KICKER}}</p>
    <h2 class="gal-mas__title">{{HEADLINE}}</h2>
  </div>

  <div class="gal-mas__cols">
    <!-- repeat: item -->
    <figure class="gal-mas__item reveal">
      <img src="{{IMG}}" alt="{{ALT}}">
      <figcaption class="gal-mas__cap">{{CAPTION}}</figcaption>
    </figure>
    <!-- /repeat -->
  </div>
</section>
