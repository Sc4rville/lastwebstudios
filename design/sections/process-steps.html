<!-- process-steps · process · 3-4 étapes numérotées en ligne (grille), gros numéros, titres courts -->
<section class="proc-st" data-section="process-steps">
  <style>
    .proc-st{background:var(--bg); color:var(--fg);
      padding:clamp(48px,8vw,112px) clamp(20px,5vw,80px)}
    .proc-st__head{max-width:60ch; margin:0 0 clamp(36px,5vw,64px)}
    .proc-st__kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
      font-size:12px; color:var(--accent); margin:0 0 14px}
    .proc-st__title{font-family:var(--serif); font-weight:500; line-height:1.08; letter-spacing:-.01em;
      font-size:clamp(30px,4vw,52px); margin:0}
    .proc-st__grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(20px,3vw,40px)}
    .proc-st__step{border-top:1px solid var(--fg); padding-top:clamp(16px,2vw,24px)}
    .proc-st__num{font-family:var(--serif); font-size:clamp(48px,6vw,84px); line-height:.9;
      color:var(--accent); margin:0 0 clamp(14px,2vw,22px)}
    .proc-st__name{font-family:var(--sans); font-weight:600; font-size:clamp(17px,1.4vw,20px);
      margin:0 0 8px}
    .proc-st__text{font-family:var(--sans); font-size:15px; line-height:1.55; color:var(--muted); margin:0}
    .proc-st .reveal{opacity:1}
    @media (max-width:880px){
      .proc-st__grid{grid-template-columns:1fr 1fr; gap:clamp(20px,5vw,32px)}
    }
    @media (max-width:480px){
      .proc-st__grid{grid-template-columns:1fr}
    }
  </style>

  <div class="proc-st__head reveal">
    <p class="proc-st__kicker">{{KICKER}}</p>
    <h2 class="proc-st__title">{{HEADLINE}}</h2>
  </div>

  <div class="proc-st__grid">
    <!-- repeat: step -->
    <article class="proc-st__step reveal">
      <p class="proc-st__num">{{STEP_NUM}}</p>
      <h3 class="proc-st__name">{{STEP_TITLE}}</h3>
      <p class="proc-st__text">{{STEP_TEXT}}</p>
    </article>
    <!-- /repeat -->
  </div>
</section>
