<!-- gallery-grid · gallery · grid of projects in 2-3 columns, regular ratios, discreet captions -->
<section class="gal-grid" data-section="gallery-grid">
  <style>
    .gal-grid{background:var(--bg); color:var(--fg);
      padding:clamp(48px,8vw,112px) clamp(20px,5vw,80px)}
    .gal-grid__head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap;
      gap:20px; margin:0 0 clamp(28px,4vw,48px)}
    .gal-grid__kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
      font-size:12px; color:var(--accent); margin:0 0 14px}
    .gal-grid__title{font-family:var(--serif); font-weight:500; line-height:1.08; letter-spacing:-.01em;
      font-size:clamp(30px,4vw,52px); margin:0}
    .gal-grid__link{font-family:var(--sans); font-weight:600; font-size:15px; color:var(--fg);
      text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px}
    .gal-grid__link:hover{color:var(--accent)}
    .gal-grid__grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,1.6vw,20px)}
    .gal-grid__tile{margin:0}
    .gal-grid__frame{position:relative; aspect-ratio:4/3; overflow:hidden; border-radius:3px}
    .gal-grid__frame img{width:100%; height:100%; object-fit:cover; display:block;
      transition:transform .5s ease}
    .gal-grid__tile:hover .gal-grid__frame img{transform:scale(1.04)}
    .gal-grid__cap{font-family:var(--sans); font-size:13px; color:var(--muted); margin:10px 0 0}
    .gal-grid .reveal{opacity:1}
    @media (max-width:880px){
      .gal-grid__grid{grid-template-columns:1fr 1fr}
    }
    @media (max-width:480px){
      .gal-grid__grid{grid-template-columns:1fr}
    }
  </style>

  <div class="gal-grid__head reveal">
    <div>
      <p class="gal-grid__kicker">{{KICKER}}</p>
      <h2 class="gal-grid__title">{{HEADLINE}}</h2>
    </div>
    <a class="gal-grid__link" href="{{CTA_HREF}}">{{CTA_LABEL}}</a>
  </div>

  <div class="gal-grid__grid">
    <!-- repeat: tile -->
    <figure class="gal-grid__tile reveal">
      <span class="gal-grid__frame"><img src="{{IMG}}" alt="{{ALT}}"></span>
      <figcaption class="gal-grid__cap">{{CAPTION}}</figcaption>
    </figure>
    <!-- /repeat -->
  </div>
</section>
