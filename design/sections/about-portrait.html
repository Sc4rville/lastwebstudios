<!-- about-portrait · about · an honest owner card (name, role, 2 lines) with no fake photo, + a real link -->
<section class="about-pt" data-section="about-portrait">
  <style>
    .about-pt{background:var(--bg); color:var(--fg);
      padding:clamp(48px,8vw,112px) clamp(20px,5vw,80px)}
    .about-pt__card{display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,40px);
      align-items:center; max-width:72ch;
      border:1px solid color-mix(in srgb, var(--muted) 40%, transparent);
      border-radius:8px; padding:clamp(24px,4vw,44px)}
    /* an honest monogram: no fake photo */
    .about-pt__mono{width:clamp(72px,9vw,110px); height:clamp(72px,9vw,110px); border-radius:999px;
      display:grid; place-items:center; background:var(--accent); color:var(--bg);
      font-family:var(--serif); font-size:clamp(28px,3.4vw,44px); line-height:1; flex:0 0 auto}
    .about-pt__kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
      font-size:12px; color:var(--accent); margin:0 0 12px}
    .about-pt__name{font-family:var(--serif); font-weight:500; font-size:clamp(22px,2.6vw,34px);
      line-height:1.05; margin:0 0 4px}
    .about-pt__role{font-family:var(--sans); font-size:14px; color:var(--muted); margin:0 0 clamp(14px,2vw,20px)}
    .about-pt__text{font-family:var(--sans); font-size:clamp(15px,1.15vw,17px); line-height:1.6;
      color:var(--fg); max-width:48ch; margin:0 0 clamp(16px,2vw,22px)}
    .about-pt__link{font-family:var(--sans); font-weight:600; font-size:15px; color:var(--fg);
      text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px}
    .about-pt__link:hover{color:var(--accent)}
    .about-pt .reveal{opacity:1}
    @media (max-width:880px){
      .about-pt__card{grid-template-columns:1fr; text-align:left}
      .about-pt__mono{margin:0}
    }
  </style>

  <article class="about-pt__card reveal">
    <div class="about-pt__mono" aria-hidden="true">{{INITIALS}}</div>
    <div>
      <p class="about-pt__kicker">{{KICKER}}</p>
      <h2 class="about-pt__name">{{PERSON_NAME}}</h2>
      <p class="about-pt__role">{{PERSON_ROLE}}</p>
      <p class="about-pt__text">{{TEXT}}</p>
      <a class="about-pt__link" href="{{LINK_HREF}}">{{LINK_LABEL}}</a>
    </div>
  </article>
</section>
