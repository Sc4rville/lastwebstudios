<!-- testimonials-video · testimonials · video-testimonial thumbnails (click-to-load YouTube facade) + 1 strong quote alongside -->
<section class="tst-vid" data-section="testimonials-video">
  <style>
    .tst-vid{background:var(--bg); color:var(--fg);
      padding:clamp(48px,8vw,112px) clamp(20px,5vw,80px);
      display:grid; grid-template-columns:0.85fr 1.15fr; gap:clamp(32px,5vw,72px); align-items:center}
    .tst-vid__kicker{font-family:var(--mono); text-transform:uppercase; letter-spacing:.18em;
      font-size:12px; color:var(--accent); margin:0 0 16px}
    .tst-vid__quote{font-family:var(--serif); font-weight:500; line-height:1.2; letter-spacing:-.01em;
      font-size:clamp(26px,3.2vw,46px); margin:0 0 clamp(18px,2.5vw,28px)}
    .tst-vid__author{font-family:var(--sans); font-size:15px; color:var(--muted); margin:0}
    .tst-vid__author b{color:var(--fg)}
    .tst-vid__grid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,1.8vw,22px)}
    /* click-to-load facade: thumbnail + play button, NO automatic iframe */
    .tst-vid__facade{position:relative; display:block; aspect-ratio:16/10; overflow:hidden;
      border-radius:6px; text-decoration:none; cursor:pointer}
    .tst-vid__facade img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s}
    .tst-vid__facade:hover img{transform:scale(1.05)}
    .tst-vid__facade::after{content:""; position:absolute; inset:0;
      background:linear-gradient(transparent 40%, rgba(0,0,0,.5))}
    .tst-vid__play{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1;
      width:clamp(52px,6vw,72px); height:clamp(52px,6vw,72px); border-radius:999px;
      background:var(--accent); color:var(--bg); display:grid; place-items:center;
      transition:transform .2s}
    .tst-vid__facade:hover .tst-vid__play{transform:translate(-50%,-50%) scale(1.08)}
    .tst-vid__play svg{width:42%; height:42%; margin-left:2px}
    .tst-vid__label{position:absolute; left:14px; bottom:12px; z-index:1; color:#fff;
      font-family:var(--sans); font-weight:600; font-size:14px}
    .tst-vid .reveal{opacity:1}
    @media (max-width:880px){
      .tst-vid{grid-template-columns:1fr; gap:clamp(28px,7vw,40px)}
    }
  </style>

  <div class="reveal">
    <p class="tst-vid__kicker">{{KICKER}}</p>
    <blockquote class="tst-vid__quote">{{QUOTE}}</blockquote>
    <p class="tst-vid__author"><b>{{AUTHOR}}</b>, {{AUTHOR_ROLE}}</p>
  </div>

  <div class="tst-vid__grid">
    <!-- repeat: video -->
    <a class="tst-vid__facade reveal" href="{{VIDEO_URL}}" target="_blank" rel="noopener"
       aria-label="{{VIDEO_ARIA}}">
      <img src="{{THUMB_IMG}}" alt="{{THUMB_ALT}}">
      <span class="tst-vid__play" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </span>
      <span class="tst-vid__label">{{VIDEO_LABEL}}</span>
    </a>
    <!-- /repeat -->
  </div>
</section>
