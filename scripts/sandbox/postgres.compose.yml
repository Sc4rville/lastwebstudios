# Fallback for `npm run sandbox -- --db docker`: a throwaway Postgres, without TLS, on the loopback only.
# The port comes from SANDBOX_PG_PORT (the sandbox picks a free one); `down -v` on exit wipes everything.
name: lws-sandbox-${SANDBOX_PG_PORT:-55432}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lws
      POSTGRES_PASSWORD: lws
      POSTGRES_DB: lws
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:${SANDBOX_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lws", "-d", "lws", "-h", "127.0.0.1"]
      interval: 1s
      retries: 60
